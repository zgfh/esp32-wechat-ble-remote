<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1200" height="1600" rx="10" fill="#f1f5f9" stroke="none" stroke-width="2" />
<text x="40" y="52" font-size="30" fill="#172b4d" text-anchor="start">ESP32-S3 N8R2 + 三颗 PC817 + 三颗红色 LED</text>
<text x="40" y="90" font-size="21" fill="#172b4d" text-anchor="start">当前只做灯光测试，不接遥控器。先拔 USB，接好再上电。</text>
<g transform="translate(0,120)">
<rect x="25" y="0" width="1150" height="400" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2" />
<text x="50" y="40" font-size="25" fill="#172b4d" text-anchor="start">① 锁车测试</text>
<rect x="55" y="100" width="205" height="245" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" />
<text x="157" y="140" font-size="25" fill="#172b4d" text-anchor="middle">ESP32</text>
<text x="75" y="190" font-size="23" fill="#172b4d" text-anchor="start">GPIO4</text>
<text x="75" y="310" font-size="23" fill="#172b4d" text-anchor="start">GND</text>
<path d="M260 180 L355 180" stroke="#2563eb" stroke-width="4" fill="none" />
<rect x="355" y="167" width="90" height="26" rx="3" fill="#fff7d6" stroke="#a16207" stroke-width="2" />
<text x="400" y="155" font-size="19" fill="#854d0e" text-anchor="middle">330 Ω</text>
<path d="M445 180 L540 180" stroke="#2563eb" stroke-width="4" fill="none" />
<path d="M260 300 L540 300" stroke="#475569" stroke-width="4" fill="none" />
