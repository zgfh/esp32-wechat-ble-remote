<circle cx="587" cy="144" r="7" fill="white" />
<text x="667" y="235" font-size="25" fill="white" text-anchor="middle">PC817</text>
<text x="667" y="264" font-size="16" fill="#cbd5e1" text-anchor="middle">印字面朝你</text>
<path d="M540 180 L565 180" stroke="#94a3b8" stroke-width="8" fill="none" />
<text x="540" y="162" font-size="24" fill="#172b4d" text-anchor="middle">1</text>
<text x="580" y="186" font-size="16" fill="white" text-anchor="start">阳极 A</text>
<path d="M540 300 L565 300" stroke="#94a3b8" stroke-width="8" fill="none" />
<text x="540" y="282" font-size="24" fill="#172b4d" text-anchor="middle">2</text>
<text x="580" y="306" font-size="16" fill="white" text-anchor="start">阴极 K</text>
<path d="M795 180 L770 180" stroke="#94a3b8" stroke-width="8" fill="none" />
<text x="795" y="162" font-size="24" fill="#172b4d" text-anchor="middle">4</text>
<text x="755" y="186" font-size="16" fill="white" text-anchor="end">集电极 C</text>
<path d="M795 300 L770 300" stroke="#94a3b8" stroke-width="8" fill="none" />
<text x="795" y="282" font-size="24" fill="#172b4d" text-anchor="middle">3</text>
<text x="755" y="306" font-size="16" fill="white" text-anchor="end">发射极 E</text>
<path d="M795 180 L875 180" stroke="#dc2626" stroke-width="4" fill="none" />
<path d="M935 180 L970 180" stroke="#dc2626" stroke-width="4" fill="none" />
<rect x="970" y="167" width="90" height="26" rx="3" fill="#fff7d6" stroke="#a16207" stroke-width="2" />
<text x="1015" y="155" font-size="19" fill="#854d0e" text-anchor="middle">330 Ω</text>
<path d="M1060 180 L1140 180" stroke="#dc2626" stroke-width="4" fill="none" />
<circle cx="905" cy="180" r="29" fill="#fee2e2" stroke="#ef4444" stroke-width="3" />
<text x="905" y="187" font-size="17" fill="#991b1b" text-anchor="middle">LED</text>
<text x="905" y="112" font-size="20" fill="#991b1b" text-anchor="middle">红色 LED</text>
<text x="866" y="240" font-size="18" fill="#991b1b" text-anchor="middle">短脚 −</text>
<text x="947" y="240" font-size="18" fill="#991b1b" text-anchor="middle">长脚 +</text>
<text x="1135" y="143" font-size="23" fill="#dc2626" text-anchor="middle">3V3</text>
<path d="M795 300 L1140 300" stroke="#475569" stroke-width="4" fill="none" />
<text x="1135" y="335" font-size="23" fill="#475569" text-anchor="middle">GND</text>
<text x="820" y="370" font-size="19" fill="#172b4d" text-anchor="start">右侧 3V3、GND 也接 ESP32</text>
<text x="50" y="375" font-size="18" fill="#172b4d" text-anchor="start">可选：GPIO4 与 GND 之间另接一只 10kΩ 下拉电阻。</text>
</g>
