<text x="40" y="1412" font-size="20" fill="#172b4d" text-anchor="start">● 先按圆点／1 脚标记确认方向；本图适用于裸四脚 PC817，不是接线模块。</text>
<text x="40" y="1447" font-size="20" fill="#172b4d" text-anchor="start">● 三路共用 ESP32 的 3V3 / GND；LED 长脚朝 3V3，短脚朝光耦 4 脚。</text>
<text x="40" y="1482" font-size="20" fill="#172b4d" text-anchor="start">● 将来改接遥控器时，拆掉右侧测试线路；光耦 3、4 脚不再接 ESP32 电源或地。</text>
