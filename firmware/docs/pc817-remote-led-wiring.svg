<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1750" viewBox="0 0 1400 1750"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1400" height="1750" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="35" y="48" font-size="30" fill="#172b4d">普通 ESP32 → PC817 → 遥控器按键，同时保留 LED</text>
<text x="35" y="85" font-size="22" fill="#172b4d">LED 改接到 GPIO 输入侧：每路两只独立 330Ω 电阻。遥控器保留原电池，与 ESP32 不共地。</text>
