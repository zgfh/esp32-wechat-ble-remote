<text x="1070" y="106" font-size="19" fill="#172b4d">按键焊盘 A（相对正）</text>
<text x="1070" y="206" font-size="19" fill="#172b4d">按键焊盘 B（相对负）</text>
<text x="1080" y="157" font-size="18" fill="#172b4d">原按键保留</text>
<text x="850" y="265" font-size="21" fill="#b91c1c">4、3 脚并联在按键两端</text>
<text x="850" y="299" font-size="20" fill="#b91c1c">这里不接 ESP32 的 GND / 3V3</text>
</g>
