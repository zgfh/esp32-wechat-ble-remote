<text x="35" y="1540" font-size="22" fill="#172b4d">① 拔 USB、取下遥控器电池再焊线。四脚按键须测出“松开断路，按下导通”的两个触点。</text>
<text x="35" y="1580" font-size="22" fill="#172b4d">② 装电池，用直流电压档测触点对：4 脚接相对正端，3 脚接相对负端；焊接前再次取下电池。</text>
<text x="35" y="1620" font-size="22" fill="#172b4d">③ 若电压方向跳变、按键为扫描矩阵，先确认电路，不要按图猜焊盘位置。A/B 不是固定左右脚。</text>
<text x="35" y="1660" font-size="22" fill="#172b4d">④ GPIO26 / 27 / 25 / 33 各可加 10kΩ 到 ESP32 GND。LED 亮仅表示 GPIO 输出，不证明车辆动作成功。</text>
<text x="35" y="1700" font-size="22" fill="#b91c1c">从旧测试图迁移：LED 和它的电阻移到左侧支路；彻底断开光耦 3、4 脚原来的 ESP32 电源线。</text>
</svg>