<text x="220" y="223" font-size="18" fill="#172b4d">指示灯支路</text>
<polyline points="150,200 195,200" fill="none" stroke="#475569" stroke-width="4"/>
<polyline points="238,200 600,200" fill="none" stroke="#475569" stroke-width="4"/><text x="50" y="206" font-size="22" fill="#172b4d">GND</text>
<circle cx="560" cy="200" r="6" fill="#475569"/>
